# Step 13: project comparison, not an exact reproduction of either paper.
task: qm9
phase: pilot  # pilot or final; final requires a successful compatible pilot.
locked: false  # Set only after reviewing the complete matrix and cost settings.
seeds:
  pilot: null
  final: null
outputs_per_seed:
  pilot: null
  final: null

inputs:
  assets_manifest: null
  checkpoint_manifest: null
  calibration_manifest: null  # One independent BASE Pass@95 threshold for ALL rows.
  upstream_verifier_manifest: null  # native128 snapshot labels: upstream control.
  native_verifier_manifest: null  # Post-hoc masks: matched native-conditional control.
  panel_manifest: null  # Locked native-conditional panel; never generated by benchmark.

configs:
  inference: configs/mdm_vgb.yaml  # L_f/L_b/K/lambda/chi/N from upstream, with declared project changes.
  cars: configs/cars.yaml  # Fill fixed counts/caps after profiling; no guessed defaults here.
  reference: configs/reference_checks.yaml
  values: configs/value_checks.yaml
  evaluation: configs/evaluation.yaml

gates:
  verification_manifest: null  # Completed full Step 12 suite for the current source.
  pilot_manifest: null  # Required in phase=final; same scientific contract, ready=true.

# A cold start for each method/seed attempt. Online reuse WITHIN an attempt is
# preserved (including standalone CARS across outputs); no cache crosses seeds.
cache_mode: cold

matrix:
  - {id: base-native, group: standalone, method: base_native, verifier: none, value_law: native-conditional}
  - {id: bon-native, group: standalone, method: bon, verifier: none, value_law: native-conditional}
  - {id: vgb-upstream, group: standalone, method: vgb, verifier: neural, value_law: upstream-native}
  - {id: cars-qm9, group: standalone, method: cars, verifier: none, value_law: rho}
  - {id: vgb-neural-native, group: integration, method: vgb, verifier: neural, value_law: native-conditional}
  - {id: vgb-mc-native, group: integration, method: vgb, verifier: mc, value_law: native-conditional}
  - {id: vgb-cars-native, group: integration, method: vgb, verifier: cars, value_law: native-conditional}
  - {id: base-rho, group: diagnostic, method: base_rho, verifier: none, value_law: rho}
  - {id: rs-rho, group: diagnostic, method: rs, verifier: none, value_law: rho}
  - {id: ars-rho, group: diagnostic, method: ars, verifier: none, value_law: rho}

# Additionally check MC/neural/CARS together on the SAME native panel per seed.
# This records value error/availability separately from generated molecules.
value_estimators: [mc, neural, cars]

provenance:
  baseline: MDM-VGB Appendix F and released qm9_inference.yaml; N=16, n=32, walk cap n*N.
  cars: CARS Sections 3-4 and Appendix F/H; its original molecular task/model differs from QM9.
  project: native final denoise, Pass@95 terminal gate, hard total sequence cap, reserved completion, fixed-count CARS values, cold seed boundaries.
  counts: Pilot/final seeds and output counts must be chosen explicitly; 128 and 3x1000 are not verified paper settings.
