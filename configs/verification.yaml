# Test selection is configuration-driven; future test files are not imported here.
verification:
  phase: environment
  pytest_args: [-q]
  check_installed_dependencies: true
  phases:
    environment:
      tests: [tests/test_resource_isolation.py]
      project_files:
        - pyproject.toml
        - src/__init__.py
        - src/tasks/common.py
        - modal/common.py
        - modal/verify.py
        - configs/common.yaml
        - configs/modal.yaml
        - tests/conftest.py
      artifacts: {}
    benchmark:
      tests: [tests/test_data_reward.py]
      project_files:
        - assets/benchmark/source.json
        - assets/benchmark/smarts.json
        - assets/benchmark/acrylates.prompt.txt
        - assets/benchmark/acrylates.examples.smi
        - assets/benchmark/acrylates.lark
        - assets/benchmark/chain_extenders.prompt.txt
        - assets/benchmark/chain_extenders.examples.smi
        - assets/benchmark/chain_extenders.lark
        - assets/benchmark/isocyanates.prompt.txt
        - assets/benchmark/isocyanates.examples.smi
        - assets/benchmark/isocyanates.lark
      artifacts:
        benchmark: {path: data/benchmark/manifest.json, manifest: true, kind: null, checksum: null, metadata: {}}
    corpus:
      tests: [tests/test_data_reward.py]
      project_files: []
      artifacts:
        corpus: {path: data/corpus/manifest.json, manifest: true, kind: null, checksum: null, metadata: {}}
        tokenizer: {path: data/tokenizer/metadata.json, manifest: false, kind: null, checksum: null, metadata: {}}
        vocabulary: {path: data/tokenizer/vocab.json, manifest: false, kind: null, checksum: null, metadata: {}}
        train_tokens: {path: data/tokenized/train/manifest.json, manifest: true, kind: null, checksum: null, metadata: {}}
        validation_tokens: {path: data/tokenized/validation/manifest.json, manifest: true, kind: null, checksum: null, metadata: {}}
        test_tokens: {path: data/tokenized/test/manifest.json, manifest: true, kind: null, checksum: null, metadata: {}}
    cars:
      tests: [tests/test_cars.py]
      project_files:
        - src/trie.py
        - src/cars.py
        - src/tasks/generate_cars.py
        - modal/generate_cars.py
        - configs/cars.yaml
        - configs/replication.yaml
      artifacts:
        benchmark: {path: data/benchmark/manifest.json, manifest: true, kind: null, checksum: null, metadata: {}}
    values:
      tests: [tests/test_values.py, tests/test_value_eval.py]
      project_files:
        - src/values.py
        - src/reference.py
        - src/cars.py
        - src/completion.py
        - src/tasks/evaluate_value.py
        - modal/evaluate_value.py
        - configs/value_eval.yaml
      artifacts: {}
    integration:
      tests: [tests/test_integration.py, tests/test_compare.py]
      project_files:
        - src/mdm_vgb.py
        - src/hybrid.py
        - src/tasks/generation.py
        - src/tasks/generate_base.py
        - src/tasks/generate_mdm_vgb.py
        - src/tasks/generate_hybrid.py
        - modal/generate_base.py
        - modal/generate_mdm_vgb.py
        - modal/generate_hybrid.py
        - configs/base.yaml
        - configs/mdm_vgb.yaml
        - configs/hybrid.yaml
        - tests/test_values.py
        - src/tasks/compare.py
        - modal/compare.py
        - configs/comparison.yaml
      artifacts: {}
    metrics:
      tests: [tests/test_metrics.py]
      project_files:
        - src/metrics.py
        - src/retrosynthesis.py
        - src/reporting.py
        - src/tasks/evaluate.py
        - src/tasks/report.py
        - modal/evaluate.py
        - modal/report.py
        - configs/evaluation.yaml
        - configs/report.yaml
      # T14 checks real generation artifacts; unit checks use finite fixtures.
      artifacts: {}
    all:
      includes: [environment, benchmark, corpus, cars, values, integration, metrics]
