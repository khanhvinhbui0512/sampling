defaults: [data.yaml]

# QM9 starting point: 4 layers, hidden 256, 4 heads, sigmoid, MSE,
# LR 1e-4, global batch 2048, weight decay 0, and at most 200 epochs.
# Group conditioning, length 256, validation selection/calibration and resume are new.
verifier:
  version: smiles-process-verifier-v1
  data:
    manifest: null  # Supply --rollouts with T06's published manifest.
  architecture:
    layers: 4
    hidden_size: 256
    heads: 4
    feedforward_ratio: 4
    dropout: 0.1
    max_length: 256
    output_activation: sigmoid
    pooling: fixed_width_mean
    group_conditioning: true
  training:
    epochs: 200
    global_batch_size: 2048
    micro_batch_size: 64
    learning_rate: 0.0001
    weight_decay: 0.0
    gradient_clip: 1.0
    betas: [0.9, 0.999]
    adam_epsilon: 0.00000001
    scheduler: constant
    device: auto
    dtype: bfloat16
    # Visit every train snapshot once per epoch using bounded shard caching.
    sampler: shuffled_shards_and_rows
    cache_shards: 2
    log_every_updates: 20
    save_every_updates: 100
    early_stopping_patience: null
  validation:
    split: validation
    batch_size: 64
    selection: minimum_mse
    calibration_bins: 10
    mask_fraction_edges: [0.0, 0.25, 0.5, 0.75, 1.0]

suites:
  smoke:
    verifier:
      architecture:
        layers: 2
        hidden_size: 64
        heads: 4
      training:
        epochs: 2
        global_batch_size: 8
        micro_batch_size: 4
        log_every_updates: 1
        save_every_updates: 2
      validation:
        batch_size: 4
