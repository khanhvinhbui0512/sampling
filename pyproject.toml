[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smiles-cars-mdm-vgb"
version = "0.1.0"
description = "Compare CARS, MDM-VGB, and their hybrid on molecular generation with SMILES."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Models, training, and checkpoint downloads.
    "accelerate>=1.10.1,<2",
    "einops>=0.8,<1",
    "huggingface-hub>=0.34,<1",
    "safetensors>=0.4.3,<1",
    "torch==2.8.0",  # CARS paper, Appendix B.
    "transformers>=4.56.2,<5",
    # Grammar constraints and molecular validation.
    "llguidance==0.7.30",  # CARS paper, Appendix B.
    "rdkit==2025.3.6",  # CARS paper, Appendix B.
    "syntheseus-retro-star-benchmark @ git+https://github.com/AustinT/syntheseus-retro-star-benchmark.git@2f4e2fa20a5c83c667d7b4de5bce3a35f1420520",
    "xgrammar>=0.1.25,<0.2",
    # Data, configuration, progress logs, and reports.
    "datasets>=3.6,<5",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=19,<23",
    "pyyaml>=6,<7",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
modal = ["modal>=1.1,<2"]
dev = [
    "pip-tools>=7.6,<8",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools]
include-package-data = false
py-modules = []

# src is the package itself; discover it from the repository root.
[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
exclude = ["resource", "resource.*", "modal", "modal.*", "tests", "tests.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
