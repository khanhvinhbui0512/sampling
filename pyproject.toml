[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cars-mdm-vgb-qm9"
version = "0.1.0"
description = "Compare CARS and masked diffusion value guidance on QM9."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Nam"}]
dependencies = [
    "numpy",
    "PyYAML",
    "torch",
    "transformers",
    "datasets",
    "huggingface-hub",
    "safetensors",
    "einops",
    "rdkit",
    "tqdm",
]

[project.optional-dependencies]
modal = ["modal"]
analysis = ["scipy", "matplotlib"]
dev = ["pytest", "ruff", "lark", "setuptools>=68", "wheel"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
markers = ["gpu: explicit opt-in CUDA smoke test"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
